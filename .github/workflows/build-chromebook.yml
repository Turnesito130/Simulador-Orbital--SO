name: Crear ZIP descargable para Chromebook

on:
  push:
    branches:
      - desarrollo/primera-version
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-offline:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar motor 3D y empaquetador
        run: npm install --no-save three@0.160.0 esbuild
      - name: Crear versión autocontenida
        run: node scripts/build-offline.mjs
      - name: Comprobar HTML, JavaScript y ausencia de CDN
        run: |
          test -s dist/Simulador-Orbital-SO/index.html
          ! grep -q 'cdn.jsdelivr.net' dist/Simulador-Orbital-SO/index.html
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class ScriptParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.inside = False
                  self.scripts = []
                  self.current = ""
              def handle_starttag(self, tag, attrs):
                  if tag == "script":
                      self.inside = True
                      self.current = ""
              def handle_data(self, data):
                  if self.inside:
                      self.current += data
              def handle_endtag(self, tag):
                  if tag == "script" and self.inside:
                      self.scripts.append(self.current)
                      self.inside = False
          html = Path("dist/Simulador-Orbital-SO/index.html").read_text()
          parser = ScriptParser()
          parser.feed(html)
          assert len(parser.scripts) == 1, f"Se esperaba un solo script autocontenido, hay {len(parser.scripts)}"
          assert html.count("</script>") == 1, "Hay un cierre de script inesperado dentro del bundle"
          Path("/tmp/so-bundle-check.js").write_text(parser.scripts[0])
          print("HTML válido: un único script autocontenido.")
          PY
          node --check /tmp/so-bundle-check.js
      - name: Publicar ZIP descargable
        uses: actions/upload-artifact@v4
        with:
          name: Simulador-Orbital-SO-Chromebook
          path: dist/Simulador-Orbital-SO/
          if-no-files-found: error
          retention-days: 30
