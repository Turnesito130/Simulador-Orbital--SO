name: Crear ZIP descargable para Chromebook

on:
  push:
    branches:
      - desarrollo/primera-version
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-offline:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar motor 3D y empaquetador
        run: npm install --no-save three@0.160.0 esbuild
      - name: Crear versión autocontenida
        run: node scripts/build-offline.mjs
      - name: Comprobar bundle JavaScript local y ausencia de CDN
        run: |
          test -s dist/Simulador-Orbital-SO/index.html
          test -s dist/Simulador-Orbital-SO/app.js
          test -s dist/Simulador-Orbital-SO/assets/textures/2k_earth_daymap.jpg
          test -s dist/Simulador-Orbital-SO/assets/textures/2k_mars.jpg
          test -s dist/Simulador-Orbital-SO/assets/textures/2k_jupiter.jpg
          test -s dist/Simulador-Orbital-SO/assets/textures/2k_saturn_ring_alpha.png
          test -s dist/Simulador-Orbital-SO/FUENTES-TEXTURAS.txt
          ! grep -q 'cdn.jsdelivr.net' dist/Simulador-Orbital-SO/index.html
          grep -q '<script src="./app.js"></script>' dist/Simulador-Orbital-SO/index.html
          node --check dist/Simulador-Orbital-SO/app.js
      - name: Publicar ZIP descargable
        uses: actions/upload-artifact@v4
        with:
          name: Simulador-Orbital-SO-Chromebook
          path: dist/Simulador-Orbital-SO/
          if-no-files-found: error
          retention-days: 30
