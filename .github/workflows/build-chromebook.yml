name: Crear ZIP descargable para Chromebook

on:
  push:
    branches:
      - desarrollo/primera-version
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-offline:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar motor 3D y empaquetador
        run: npm install --no-save three@0.160.0 esbuild
      - name: Crear versión autocontenida
        run: node scripts/build-offline.mjs
      - name: Comprobar que el ZIP contiene el simulador
        run: |
          test -s dist/Simulador-Orbital-SO/index.html
          ! grep -q 'cdn.jsdelivr.net' dist/Simulador-Orbital-SO/index.html
      - name: Crear ZIP
        run: |
          cd dist
          zip -r ../Simulador-Orbital-SO-Chromebook.zip Simulador-Orbital-SO
      - name: Publicar ZIP como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: Simulador-Orbital-SO-Chromebook
          path: Simulador-Orbital-SO-Chromebook.zip
          if-no-files-found: error
          retention-days: 30
