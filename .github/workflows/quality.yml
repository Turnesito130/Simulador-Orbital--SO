name: SO quality checks

on:
  push:
    branches: [desarrollo/primera-version]
  pull_request:
    branches: [desarrollo/primera-version]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate simulator
        run: node scripts/validate.mjs
